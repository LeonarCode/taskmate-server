services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # host Postgres (pgAdmin) ang gagamitin, hindi container
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # dev mode: auto-reload kapag nag-edit ka ng code
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app